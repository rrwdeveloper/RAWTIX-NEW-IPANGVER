<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  <base target="_top">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --pad-x: clamp(20px, 6.95vw, 120px);
    }
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: #000;
    }
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #scene.dragging {
      cursor: grabbing;
    }
    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    .ui a, .ui button {
      pointer-events: auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
    }
    .logo-mark {
      width: 20px;
      height: 40px;
      background: #fff;
      border-radius: 0 20px 20px 0;
    }
    .logo b {
      font-weight: 700;
    }
    .logo span {
      font-weight: 400;
    }
    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .35s ease;
    }
    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* ARROWS (top-right, left of the dots column) */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }
    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid #fff;
      background: transparent;
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .25s, color .25s;
      padding: 0;
      outline: none;
    }
    .arrow svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    .arrow:hover {
      background: #fff;
      color: #000;
    }

    /* PAGINATION DOTS (vertical, right edge) */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      background: #fff;
      cursor: pointer;
      transition: background .25s;
      padding: 0;
      outline: none;
    }
    .dot.active {
      background: transparent;
    }

    /* TAGLINE (bottom-left) */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
    }
    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW (button → horizontal line → giant outlined "07" bleeding off the right edge) */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }
    .cta {
      flex: none;
      padding: 0 15px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid rgba(255, 255, 255, .85);
      border-radius: 6px;
      background: rgba(0, 0, 0, .15);
      color: #fff;
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background .25s, color .25s;
    }
    .cta:hover {
      background: #fff;
      color: #000;
    }
    .cta-line {
      flex: 1;
      height: 1.5px;
      background: rgba(255, 255, 255, .8);
      min-width: 40px;
    }
    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, .9);
      transform: translateY(6%);
      user-select: none;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: .6;
      transition: opacity .6s;
      pointer-events: none;
    }
    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }
    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }
    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>
    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>
      <header class="nav">
        <a href="#" class="logo"><i class="logo-mark"></i><b>Design</b><span>World</span></a>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="/shop">Portfolio</a></li>
          <li><a href="#">Contact Us</a></li>
        </ul>
      </header>
      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6"/>
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
      <nav class="dots">
        <button class="dot" data-index="0" aria-label="Slide 1"></button>
        <button class="dot active" data-index="1" aria-label="Slide 2"></button>
        <button class="dot" data-index="2" aria-label="Slide 3"></button>
      </nav>
      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>
      <div class="cta-row">
        <a href="/shop" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>
      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    const canvas = document.getElementById('scene');
    const loaderEl = document.getElementById('loader');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const dotButtons = Array.from(document.querySelectorAll('.dots .dot'));

    // 1. WebGL Renderer
    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
    });
    renderer.setClearColor(0x000000, 1.0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    let DPR = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(DPR);

    // 2. Camera
    let W = window.innerWidth;
    let H = window.innerHeight;
    const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    // 3. Scene Graph
    const scene = new THREE.Scene();
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    scene.add(pivot);
    pivot.add(spinner);

    // Initial spinner rotation: Euler(-0.42, 0.62, 0.18)
    spinner.rotation.set(-0.42, 0.62, 0.18, 'XYZ');

    // 4. Background Scene & Headline Texture
    const headCanvas = document.createElement('canvas');
    const headCtx = headCanvas.getContext('2d');
    const headTexture = new THREE.CanvasTexture(headCanvas);
    headTexture.colorSpace = THREE.SRGBColorSpace;
    headTexture.minFilter = THREE.LinearFilter;
    headTexture.magFilter = THREE.LinearFilter;
    headTexture.generateMipmaps = false;

    const bgScene = new THREE.Scene();
    const bgCamera = new THREE.Camera();
    const bgQuadGeo = new THREE.PlaneGeometry(2, 2);
    const bgQuadMat = new THREE.ShaderMaterial({
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      uniforms: {
        uTex: { value: headTexture },
      },
      depthTest: false,
      depthWrite: false,
    });
    const bgQuadMesh = new THREE.Mesh(bgQuadGeo, bgQuadMat);
    bgQuadMesh.frustumCulled = false;
    bgScene.add(bgQuadMesh);

    function drawHeadlineCanvas() {
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      const cw = Math.floor(W * DPR);
      const ch = Math.floor(H * DPR);
      if (headCanvas.width !== cw || headCanvas.height !== ch) {
        headCanvas.width = cw;
        headCanvas.height = ch;
      }

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
      const lines = ['Explore', 'New', 'Ideas'];
      const maxAllowedW = W * (mobile ? 0.9 : 0.5);

      headCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      headCtx.font = `800 ${fs}px Poppins`;

      let maxLineW = 0;
      for (const line of lines) {
        const measured = headCtx.measureText(line).width;
        if (measured > maxLineW) maxLineW = measured;
      }

      if (maxLineW > maxAllowedW && maxLineW > 0) {
        fs = fs * (maxAllowedW / maxLineW);
        headCtx.font = `800 ${fs}px Poppins`;
      }

      headCtx.fillStyle = '#000000';
      headCtx.fillRect(0, 0, W, H);

      headCtx.fillStyle = '#e9e9e9';
      headCtx.textAlign = 'center';
      headCtx.textBaseline = 'alphabetic';

      const cx = W * (mobile ? 0.5 : 0.505);
      const cy = H * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const cap = fs * 0.7;

      for (let i = 0; i < 3; i++) {
        const y = cy + cap / 2 + (i - 1) * gap;
        headCtx.fillText(lines[i], cx, y);
      }

      headTexture.needsUpdate = true;
    }

    // 5. Custom Glass Shader Materials
    const glassVertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;

      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const glassFragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;

      varying vec3 vNormal;
      varying vec3 vEye;

      float specularCalc(vec3 n, vec3 lightDir, vec3 viewDir, float shininess, float diffuseness) {
        vec3 lightVec = normalize(-lightDir);
        vec3 halfVec = normalize(lightVec + viewDir);
        return pow(max(dot(n, halfVec), 0.0), shininess) + max(0.0, dot(n, lightVec)) * diffuseness;
      }

      float luma(vec3 c) {
        return dot(c, vec3(0.2125, 0.7154, 0.0721));
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);

        const int LOOP = 16;
        vec3 color = vec3(0.0);

        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 refrR = refract(eye, n, 1.0 / uIorR);
          vec3 refrY = refract(eye, n, 1.0 / uIorY);
          vec3 refrG = refract(eye, n, 1.0 / uIorG);
          vec3 refrC = refract(eye, n, 1.0 / uIorC);
          vec3 refrB = refract(eye, n, 1.0 / uIorB);
          vec3 refrP = refract(eye, n, 1.0 / uIorP);

          vec4 texR = texture2D(uTexture, uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic);
          vec4 texY = texture2D(uTexture, uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic);
          vec4 texG = texture2D(uTexture, uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic);
          vec4 texC = texture2D(uTexture, uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic);
          vec4 texB = texture2D(uTexture, uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic);
          vec4 texP = texture2D(uTexture, uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic);

          float r = texR.x * 0.5;
          float y = (texY.x * 2.0 + texY.y * 2.0 - texY.z) / 6.0;
          float g = texG.y * 0.5;
          float c = (texC.y * 2.0 + texC.z * 2.0 - texC.x) / 6.0;
          float b = texB.z * 0.5;
          float p = (texP.z * 2.0 + texP.x * 2.0 - texP.y) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          color += vec3(R, G, B);
        }

        color /= float(LOOP);

        color = mix(vec3(luma(color)), color, uSaturation);

        vec3 view = -eye;
        float spec1 = specularCalc(n, uLight, view, uShininess, uDiffuseness);
        float spec2 = specularCalc(n, vec3(1.0, 1.0, -1.0), view, uShininess * 0.6, uDiffuseness * 0.5);
        float spec = spec1 + 0.6 * spec2;
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        float f = pow(clamp(1.0 + dot(eye, n), 0.0, 1.0), uFresnelPower);
        color = mix(color, vec3(1.0), f * (uBackside > 0.5 ? 0.25 : 0.55));

        color += vec3(0.004, 0.005, 0.007);
        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    const commonUniforms = {
      uTexture: { value: null },
      uResolution: { value: new THREE.Vector2(W * DPR, H * DPR) },
      uIorR: { value: 1.15 },
      uIorY: { value: 1.16 },
      uIorG: { value: 1.18 },
      uIorC: { value: 1.22 },
      uIorB: { value: 1.22 },
      uIorP: { value: 1.22 },
      uChromatic: { value: 0.5 },
      uSaturation: { value: 1.08 },
      uShininess: { value: 90.0 },
      uDiffuseness: { value: 0.02 },
      uFresnelPower: { value: 5.0 },
      uLight: { value: new THREE.Vector3(-1.0, 1.0, 1.0) },
    };

    const backMat = new THREE.ShaderMaterial({
      vertexShader: glassVertexShader,
      fragmentShader: glassFragmentShader,
      side: THREE.BackSide,
      uniforms: {
        ...THREE.UniformsUtils.clone(commonUniforms),
        uRefractPower: { value: 0.22 },
        uBackside: { value: 1.0 },
      },
    });

    const frontMat = new THREE.ShaderMaterial({
      vertexShader: glassVertexShader,
      fragmentShader: glassFragmentShader,
      side: THREE.FrontSide,
      uniforms: {
        ...THREE.UniformsUtils.clone(commonUniforms),
        uRefractPower: { value: 0.30 },
        uBackside: { value: 0.0 },
      },
    });

    // 6. Mesh & Render Targets
    const cubeMesh = new THREE.Mesh(new THREE.BufferGeometry(), frontMat);
    spinner.add(cubeMesh);

    let rtBack = null;
    let rtFront = null;

    function updateRenderTargets(rw, rh) {
      // Guard against zero-size render targets (can happen on init or resize edge cases)
      rw = Math.max(1, rw);
      rh = Math.max(1, rh);

      if (rtBack) rtBack.dispose();
      if (rtFront) rtFront.dispose();

      rtBack = new THREE.WebGLRenderTarget(rw, rh, {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        generateMipmaps: false,
      });

      rtFront = new THREE.WebGLRenderTarget(rw, rh, {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        generateMipmaps: false,
      });

      backMat.uniforms.uTexture.value = rtBack.texture;
      frontMat.uniforms.uTexture.value = rtFront.texture;
      backMat.uniforms.uResolution.value.set(rw, rh);
      frontMat.uniforms.uResolution.value.set(rw, rh);
    }

    // 7. Geometry Processing & Model Loading
    function processAndApplyGeometry(geometry) {
      geometry.computeBoundingBox();
      const bbox = geometry.boundingBox;
      const center = new THREE.Vector3();
      bbox.getCenter(center);
      geometry.translate(-center.x, -center.y, -center.z);

      const size = new THREE.Vector3();
      bbox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        geometry.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
      }

      cubeMesh.geometry = geometry;
      loaderEl.classList.add('done');
    }

    function fallbackGeometry() {
      const geo = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      processAndApplyGeometry(geo);
    }

    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        try {
          const geometries = [];
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((child) => {
            if (child.isMesh && child.geometry) {
              let g = child.geometry.clone();
              if (g.attributes.uv) g.deleteAttribute('uv');
              if (g.attributes.color) g.deleteAttribute('color');
              if (g.attributes.tangent) g.deleteAttribute('tangent');
              g = mergeVertices(g, 1e-4);
              g.computeVertexNormals();
              g.applyMatrix4(child.matrixWorld);
              geometries.push(g);
            }
          });

          if (geometries.length > 0) {
            const merged = geometries.length === 1 ? geometries[0] : mergeGeometries(geometries);
            processAndApplyGeometry(merged);
          } else {
            fallbackGeometry();
          }
        } catch (e) {
          console.warn('Fallback due to geometry processing error:', e);
          fallbackGeometry();
        }
      },
      undefined,
      (err) => {
        console.warn('GLTF loading failed, falling back to RoundedBoxGeometry:', err);
        fallbackGeometry();
      }
    );

    // 8. Layout Calculation
    function layout() {
      W = window.innerWidth;
      H = window.innerHeight;
      DPR = Math.min(window.devicePixelRatio || 1, 2);

      renderer.setPixelRatio(DPR);
      renderer.setSize(W, H);

      camera.aspect = W / H;
      camera.updateProjectionMatrix();

      const rw = Math.floor(W * DPR);
      const rh = Math.floor(H * DPR);
      updateRenderTargets(rw, rh);

      const fovRad = (camera.fov * Math.PI) / 180;
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;

      const mobile = (W < 768) || (W / H < 1);
      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
      const s = (px / H) * visH;
      pivot.scale.set(s, s, s);

      drawHeadlineCanvas();
    }

    // 9. Interaction & Animation
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    let velX = 0;
    let velY = 0;
    let idleTimer = 0.6;
    let idleBlend = 1.0;
    let arrowRemainingAngle = 0;

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      velX = 0;
      velY = 0;
      arrowRemainingAngle = 0;
      idleTimer = 0;
      idleBlend = 0;
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const deltaX = e.clientX - lastPointerX;
      const deltaY = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      const dx = deltaX * 0.008;
      const dy = deltaY * 0.008;

      velX = dx;
      velY = dy;

      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
      spinner.quaternion.premultiply(qY);
      spinner.quaternion.premultiply(qX);
    });

    const stopDragging = (e) => {
      if (isDragging) {
        isDragging = false;
        canvas.classList.remove('dragging');
        try {
          canvas.releasePointerCapture(e.pointerId);
        } catch (_) {}
      }
    };

    canvas.addEventListener('pointerup', stopDragging);
    canvas.addEventListener('pointercancel', stopDragging);

    prevBtn.addEventListener('click', () => {
      arrowRemainingAngle -= Math.PI / 2;
      velX = 0;
      velY = 0;
      idleTimer = 0;
      idleBlend = 0;
    });

    nextBtn.addEventListener('click', () => {
      arrowRemainingAngle += Math.PI / 2;
      velX = 0;
      velY = 0;
      idleTimer = 0;
      idleBlend = 0;
    });

    dotButtons.forEach((dot) => {
      dot.addEventListener('click', () => {
        dotButtons.forEach((d) => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    window.addEventListener('resize', layout);
    if (document.fonts) {
      document.fonts.addEventListener('loadingdone', drawHeadlineCanvas);
    }

    // 10. Main Render Loop
    let lastTime = performance.now();

    function animate(currentTime) {
      requestAnimationFrame(animate);

      let dt = (currentTime - lastTime) / 1000;
      lastTime = currentTime;
      if (dt > 0.05) dt = 0.05;
      const frameRatio = dt * 60;

      if (!isDragging) {
        if (Math.abs(arrowRemainingAngle) > 0.0001) {
          const step = arrowRemainingAngle * Math.min(1.0, 0.09 * frameRatio);
          if (Math.abs(arrowRemainingAngle) < 0.0005) {
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), arrowRemainingAngle);
            spinner.quaternion.premultiply(qY);
            arrowRemainingAngle = 0;
          } else {
            arrowRemainingAngle -= step;
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), step);
            spinner.quaternion.premultiply(qY);
          }
          velX = 0;
          velY = 0;
        } else {
          if (Math.hypot(velX, velY) > 0.00001) {
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), velX * frameRatio);
            const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), velY * frameRatio);
            spinner.quaternion.premultiply(qY);
            spinner.quaternion.premultiply(qX);

            const damping = Math.pow(0.94, frameRatio);
            velX *= damping;
            velY *= damping;
          }

          idleTimer += dt;
          if (idleTimer > 0.6) {
            idleBlend = Math.min(1.0, (idleTimer - 0.6) / 1.0);
            const driftY = 0.0035 * idleBlend * frameRatio;
            const driftX = 0.0012 * idleBlend * frameRatio;
            const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), driftY);
            const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), driftX);
            spinner.quaternion.premultiply(qY);
            spinner.quaternion.premultiply(qX);
          }
        }
      }

      // Render Pipeline (every frame)
      // Guard: skip if render targets aren't ready yet
      if (!rtBack || !rtFront) return;

      // Pass 1: bgScene -> rtBack
      renderer.autoClear = true;
      renderer.setRenderTarget(rtBack);
      renderer.clear();
      renderer.render(bgScene, bgCamera);

      // Pass 2: bgScene -> rtFront, then cube back faces -> rtFront
      renderer.setRenderTarget(rtFront);
      renderer.clear();
      renderer.render(bgScene, bgCamera);
      renderer.autoClear = false;
      cubeMesh.material = backMat;
      renderer.render(scene, camera);

      // Pass 3: bgScene -> screen, then cube front faces -> screen
      renderer.autoClear = true;
      renderer.setRenderTarget(null);
      renderer.clear();
      renderer.render(bgScene, bgCamera);
      renderer.autoClear = false;
      renderer.clearDepth();
      cubeMesh.material = frontMat;
      renderer.render(scene, camera);
      renderer.autoClear = true;
    }

    // 11. Font Loading & Initialization
    Promise.race([
      Promise.all([
        document.fonts.load('800 100px Poppins'),
        document.fonts.ready,
      ]),
      new Promise((resolve) => setTimeout(resolve, 2500)),
    ]).then(() => {
      layout();
      lastTime = performance.now();
      requestAnimationFrame(animate);
    });
  </script>
</body>
</html>
